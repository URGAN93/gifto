<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>함께 선물하기 | GIFTO</title><link rel="stylesheet" href="../css/style.css?v=20260941" /></head>
<body><main class="app-shell"><header class="topbar"><a class="back" href="wishlist.html">←</a><h1 class="page-title">함께 선물하기</h1><span class="topbar-spacer"></span></header><section class="contribute"><div class="mini-product" data-selected-product></div><div class="gift-message"><span>💌</span><div><strong data-recipient-name>친구에게 마음을 전해요</strong><p>먼저 보낼 마음을 골라 주세요.</p></div></div><section class="contribution-amount-picker"><p class="eyebrow">보낼 마음</p><h2>얼마를 함께할까요?</h2><div class="amount-presets" data-amount-presets><button type="button" data-amount="10000">₩ 1만</button><button type="button" data-amount="30000">₩ 3만</button><button type="button" data-amount="50000">₩ 5만</button></div><label class="sr-only" for="custom-amount">직접 입력할 금액</label><input id="custom-amount" class="text-field" inputmode="numeric" type="number" min="1" placeholder="직접 입력" /></section><button class="button button-primary sticky-button" type="button" data-kakao-send>금액을 선택해 주세요</button><div class="transfer-guide" data-qr-fallback hidden></div><div class="notice">카카오페이에서는 위에서 고른 금액과 동일하게 직접 입력해 주세요. 실제 입금은 받는 사람이 확인해요.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js?v=20260928"></script><script src="../js/app.js?v=20260941"></script></body></html>
