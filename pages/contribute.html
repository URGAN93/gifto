<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>함께 선물하기 | GIFTO</title><link rel="stylesheet" href="../css/style.css" /></head>
<body><main class="app-shell"><header class="topbar"><a class="back" href="wishlist.html">←</a><h1 class="page-title">함께 선물하기</h1><span class="topbar-spacer"></span></header><section class="contribute"><div class="mini-product" data-selected-product></div><div class="gift-message"><span>💌</span><div><strong data-recipient-name>심성민에게 마음을 전해요</strong><p>얼마를 함께하고 싶나요?</p></div></div><div class="amount-grid"><button data-amount="10000">10,000원</button><button data-amount="30000">30,000원</button><button data-amount="50000">50,000원</button><button data-amount="custom">직접 입력</button></div><label class="sr-only" for="custom-amount">참여 금액</label><input id="custom-amount" class="text-field amount-input" type="number" placeholder="금액을 입력하세요" /><div class="transfer-methods" data-transfer-methods hidden><p class="field-label">어떻게 보낼까요?</p><p class="transfer-empty" data-transfer-empty hidden>아직 등록된 송금 링크가 없어요.</p><button type="button" data-transfer="kakao"><span class="pay-icon kakao">K</span><strong>카카오페이</strong><small>송금 링크 열기</small><b>›</b></button><button type="button" data-transfer="toss"><span class="pay-icon toss">T</span><strong>토스</strong><small>송금 링크 열기</small><b>›</b></button><button type="button" data-transfer="naver"><span class="pay-icon naver">N</span><strong>Npay</strong><small>송금 링크 열기</small><b>›</b></button></div><div class="notice">송금은 선택한 앱에서 직접 완료합니다. 서비스는 돈을 보관하지 않으며, 성민이 입금을 확인하면 진행률에 반영돼요.</div><a class="button button-primary sticky-button is-disabled" data-complete-link href="complete.html">송금 후 확인하기</a></section></main><script src="../js/app.js"></script></body></html>
