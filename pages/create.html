<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>위시리스트 만들기 | GIFTO</title><link rel="stylesheet" href="../css/style.css" /></head>
<body><main class="app-shell"><header class="topbar"><a class="back" href="my-page.html">←</a><h1 class="page-title">위시리스트 만들기</h1><span class="topbar-spacer"></span></header>
<section class="form-page"><p class="eyebrow">내 위시리스트</p><h1>원하는 것을<br />추가해 보세요</h1><p class="form-description">계정 없이도 이 기기에서는 내용이 저장돼요.<br />친구에게 보여 줄 준비를 해볼까요?</p><label class="field-label" for="list-title">위시리스트 제목</label><input id="list-title" class="text-field" value="심성민의 생일 위시리스트" /><label class="field-label" for="list-note">한마디</label><textarea id="list-note" class="text-field textarea">올해도 함께해줘서 고마워요!</textarea><div class="add-product-panel"><div class="panel-heading"><strong>상품 추가</strong><span>상품 상세 페이지 링크를 붙여넣어 주세요</span></div><label class="field-label" for="new-product-url">상품 상세 페이지 링크 <span class="optional">선택</span></label><input id="new-product-url" class="text-field" type="url" placeholder="https://www.samsung.com/..." /><p class="field-help">대표 이미지를 자동으로 가져와요. 가져오지 못하면 선택한 아이콘으로 표시됩니다.</p><label class="field-label" for="new-product-name">상품 이름</label><input id="new-product-name" class="text-field" placeholder="예: Galaxy Watch Ultra 2" /><label class="field-label" for="new-product-price">가격</label><input id="new-product-price" class="text-field" inputmode="numeric" type="number" placeholder="예: 120000" /><label class="field-label">상품 아이콘</label><div class="emoji-choices"><button type="button" class="selected" data-emoji="🎁">🎁</button><button type="button" data-emoji="💄">💄</button><button type="button" data-emoji="📚">📚</button><button type="button" data-emoji="☕">☕</button><button type="button" data-emoji="🎮">🎮</button></div><button class="button button-ghost" type="button" data-add-product>상품 목록에 추가</button><div class="draft-products" data-draft-products></div></div><a class="button button-primary sticky-button" href="wishlist.html" data-save-wishlist>저장하고 공유 페이지 보기 <span>→</span></a></section></main><script src="../js/app.js"></script></body></html>
