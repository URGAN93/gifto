<!doctype html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>위시리스트 만들기 | GIFTO</title><link rel="stylesheet" href="../css/style.css?v=20260961" /></head>
<body><main class="app-shell"><header class="topbar"><a class="back" href="my-page.html">←</a><h1 class="page-title">위시리스트 만들기</h1><span class="topbar-spacer"></span></header>
<section class="form-page"><p class="eyebrow">내 위시리스트</p><h1>원하는 것을<br />추가해 보세요</h1><p class="form-description">계정에 안전하게 저장되고 친구에게 바로 공유할 수 있어요.</p><section class="category-picker" data-category-picker><p class="field-label">어떤 마음을 모을까요?</p><div><button type="button" data-category="birthday">🎂<span>생일 선물</span></button><button type="button" data-category="support">💛<span>응원 모금</span></button><button type="button" data-category="celebration">✨<span>기념 선물</span></button><button type="button" data-category="housewarming">🏠<span>집들이 선물</span></button><button type="button" data-category="together">🎁<span>함께 선물</span></button></div></section><label class="field-label" for="list-title">위시리스트 제목</label><input id="list-title" class="text-field" value="나의 생일 선물" /><label class="field-label" for="list-note">한마디</label><textarea id="list-note" class="text-field textarea" placeholder="친구들에게 전할 말을 적어 주세요.">생일에 받고 싶은 선물을 모아봤어요. 함께해 주는 마음만으로도 고마워요 🎁</textarea><div class="add-product-panel"><div class="panel-heading"><strong>상품 추가</strong><span>사진과 정보를 입력해 주세요</span></div><label class="field-label">상품 사진 <span class="optional">선택</span></label><button class="photo-picker" type="button" data-new-photo-picker>🖼 사진첩에서 고르기</button><input id="new-product-photo" class="sr-only" type="file" accept="image/*" /><p class="field-help" data-photo-status>JPG·PNG·WebP 사진을 올려 주세요. 크기와 용량을 자동으로 줄여요.</p><img class="product-photo-preview" data-product-photo-preview alt="등록할 상품 사진 미리보기" hidden /><button class="button button-ghost" type="button" data-remove-product-photo hidden>사진 지우기</button><label class="field-label" for="new-product-name">상품 이름</label><input id="new-product-name" class="text-field" placeholder="예: Galaxy Watch Ultra 2" /><label class="field-label" for="new-product-price">가격</label><input id="new-product-price" class="text-field" inputmode="numeric" type="text" placeholder="예: 100,000" /><label class="field-label">상품 아이콘</label><div class="emoji-choices"><button type="button" class="selected" data-emoji="🎁">🎁</button><button type="button" data-emoji="💄">💄</button><button type="button" data-emoji="📚">📚</button><button type="button" data-emoji="☕">☕</button><button type="button" data-emoji="🎮">🎮</button></div><button class="button button-ghost" type="button" data-add-product>상품 목록에 추가</button><div class="draft-products" data-draft-products></div></div><a class="button button-primary sticky-button" href="wishlist.html" data-save-wishlist>저장하고 공유 페이지 보기 <span>→</span></a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js?v=20260938"></script><script src="../js/app.js?v=20260961"></script></body></html>
