<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>참여 내역 | GIFTO</title>
  <link rel="stylesheet" href="../css/style.css?v=20260997" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="back" href="my-page.html">←</a>
      <h1 class="page-title">참여 내역</h1>
      <span class="topbar-spacer"></span>
    </header>
    <section class="form-page" data-participants-page hidden>
      <p class="eyebrow">GIFT CONTRIBUTIONS</p>
      <h1 data-participant-product>상품</h1>
      <div class="participant-product-card" data-participant-card></div>
      <div class="participants-summary">
        <p>친구들이 모아 준 마음</p>
        <strong data-participant-total>₩ 0</strong>
        <p data-participant-count>0명 참여</p>
      </div>
      <button class="button button-ghost participant-delete" type="button" data-participant-delete hidden>이 상품 삭제</button>
      <ul class="contributors-list" data-participants></ul>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js?v=20260974"></script>
  <script src="../js/contribution-history.js?v=20260974"></script><script src="../js/gift-thanks.js?v=20260997"></script><script src="../js/app.js?v=20260997"></script>
</body>
</html>
